name: Generate Sample JSON

on:
  schedule:
    # 1:00 PM IST = 07:30 UTC
    - cron: '53 7 * * *'
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate JSON file
        run: node generate-data.js

      - name: Commit and push the generated file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/sample-data.json
          git diff --staged --quiet || git commit -m "chore: update sample-data.json [skip ci]"
          git push
